# This is a basic workflow to help you get started with Actions
name: Build Backend App

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Web and Java build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    #env:
    #  JAVA_VERSION: "11.0"
    #  FLUTTER_VERSION: "2.5.3"
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set version
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '$VERSION' is not a valid x.y.z version" >&2
              exit 1
            fi
            echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
            echo "BUILD_NAME_ARG=--build-name $VERSION" >> $GITHUB_ENV
          fi
      # Build web app
      - name: build web
        working-directory: src/main/app
        run: |
          nix-shell "$GITHUB_WORKSPACE/shell.nix" --run "flutter build web --wasm --release --build-number $BUILD_NUMBER $BUILD_NAME_ARG"
          cp -R build/web ../resources/public
      # build backend

      - name: Set application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mvn versions:set -DnewVersion=${{ env.VERSION_NAME }}
          mvn versions:commit
      - name: Build Java app
        run: nix-shell --run 'mvn clean install'

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile.lite
          tags: ${{ secrets.DOCKER_USERNAME }}/spendspentspent:${{ github.sha }}

      - name: Build and push Docker image (Release)
        uses: docker/build-push-action@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          file: docker/Dockerfile.lite
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/spendspentspent:latest
            ${{ secrets.DOCKER_USERNAME }}/spendspentspent:${{ env.VERSION_NAME }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          file: target/SpendSpentSpent-*.jar
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

